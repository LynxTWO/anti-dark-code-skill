# The shadow evidence job for 1st-downs, from assets/templates/shadow-job.yml
# with its placeholders filled. Its one gate job is `test`, which carries both
# canonical gates as named steps, per shadow-gate-map.json beside this file.
# It is evidence, never a gate: it is not added to any required check.

  shadow:
    name: Shadow evidence record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out the tree CI verified
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Read what CI concluded for this attempt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -B .agents/skills/anti-dark-code/scripts/adc.py shadow outcomes \
            --map .github/shadow-gate-map.json \
            --run "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" \
            --out "${RUNNER_TEMP}/outcomes.json"

      - name: Record what the proposed rules would have skipped
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python -B .agents/skills/anti-dark-code/scripts/adc.py shadow record \
            --repo . \
            --base "${BASE_SHA}" --base-sha "${BASE_SHA}" \
            --merge "${GITHUB_SHA}" --head "${HEAD_SHA}" \
            --head-ref "${HEAD_REF}" --pr "${PR_NUMBER}" \
            --run "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" \
            --outcomes "${RUNNER_TEMP}/outcomes.json" \
            --out "${RUNNER_TEMP}/shadow-${HEAD_SHA}-${GITHUB_RUN_ATTEMPT}.json"
          git status --porcelain

      - name: Upload the record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shadow-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          # The record plus the two sidecars the record step wrote beside it,
          # which name the policy and gates by digest so ingest can recompute
          # the class rather than believe it. Not `*.json`: the outcomes file
          # lives in the same directory, and ingest would read it as a record.
          path: |
            ${{ runner.temp }}/shadow-*.json
            ${{ runner.temp }}/policy-*.json
            ${{ runner.temp }}/gates-*.json
          if-no-files-found: error
          retention-days: 90
