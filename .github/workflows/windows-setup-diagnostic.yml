name: Windows setup diagnostic

on:
  pull_request:
    paths:
      - tools/windows_setup_probe.py
      - .github/workflows/windows-setup-diagnostic.yml

permissions:
  contents: read

jobs:
  observe:
    name: Fresh Windows runner ${{ matrix.trial }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -r requirements-test-parallel.txt
          python -m pip check
      - name: Observe actual Windows setup calls during the existing suite
        shell: bash
        run: |
          set -euo pipefail
          python -B -m pytest anti-dark-code/tests -q -n auto -p tools.windows_setup_probe
