name: Efficiency ledger

on:
  pull_request_target:
    paths:
      - "metrics/ledger/**"
      - "metrics/summary.json"
      - "docs/data/efficiency-summary.json"
      - ".github/workflows/efficiency-ledger.yml"

permissions:
  contents: read

jobs:
  validate-ledger:
    name: Validate public efficiency receipt
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          # Bounded, because a fork controls this history and fetch-depth: 0 lets
          # it choose how much a privileged runner downloads. A receipt sits a
          # few commits off a recent base, so this keeps the merge base present
          # for the three-dot diff that validate-incoming and validate-ledger-pr
          # both require. Neither falls back to a two-dot diff: if the branch
          # point is older than this window the candidate is shallow, no merge
          # base exists, and validation fails closed asking the contributor to
          # rebase on a recent base. Measured: a branch one commit off the base
          # needs depth 2, and depth 1 is the shallowest that fails.
          fetch-depth: 50
          persist-credentials: false
          allow-unsafe-pr-checkout: true # Candidate files are parsed only as data by the trusted-base validator.

      - name: Make the trusted base available to the candidate diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git -C candidate fetch --no-tags ../trusted-base "$BASE_SHA"
          git -C candidate cat-file -e "$BASE_SHA^{commit}"

      - name: Validate an external receipt and generated summaries
        if: github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 -B trusted-base/anti-dark-code/scripts/adc.py efficiency validate-ledger-pr \
            --repo candidate \
            --changed-from "$BASE_SHA"

      - name: Validate an internal receipt or workflow-only maintenance
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 -B trusted-base/anti-dark-code/scripts/adc.py efficiency validate-ledger-pr \
            --repo candidate \
            --changed-from "$BASE_SHA" \
            --allow-workflow-maintenance
