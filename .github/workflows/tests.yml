name: Tests

# pull_request, deliberately not pull_request_target. A fork's pull request runs
# here without repository secrets and without write access, so running the suite
# is not the privileged surface the intake workflows are. Do not convert this to
# pull_request_target: it executes candidate code by design.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # One red platform should not hide the others, which is the whole point of
      # running more than one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          # Forward drift, cheaply. The floor is what the three platforms above
          # prove; this catches a newer interpreter changing behaviour under us.
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pytest-xdist

      - name: Validate the core before anything writes to the tree
        shell: bash
        run: |
          set -euo pipefail
          # Ordering matters and is the repository's own rule: a record written
          # after an audit attempt is unaudited. Running the suite first leaves
          # __pycache__ in the skill tree, which this validator reports. Run it
          # against the pristine checkout, and use -B so it writes none itself.
          python -B anti-dark-code/scripts/adc.py validate --skill anti-dark-code --mode universal

      - name: Run the deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          # No pipe into a summarizer here. A pipeline reports its last stage, so
          # piping pytest into tail would report tail's status and a red suite
          # would read as green. See the shell exit-code contract in
          # references/14-deterministic-verification.md.
          python -m pytest anti-dark-code/tests -q -n auto

  distribution:
    name: Clean distribution archive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate what a release would actually ship
        shell: bash
        run: |
          set -euo pipefail
          # A working tree can pass while the distributable archive does not: the
          # runtime-only incoming/ inbox shipped inside a release once and only a
          # clean archive showed it. Extract the commit, not the checkout.
          extract="$(mktemp -d)"
          git archive HEAD | tar -x -C "$extract"
          python -B "$extract/anti-dark-code/scripts/adc.py" \
            validate --skill "$extract/anti-dark-code" --mode distribution

  hostile-environment:
    name: Hostile environment (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Two environments that exist, rather than one that cannot. An ASCII
          # locale with non-ASCII paths is self-contradictory: a system whose
          # paths are non-ASCII has a locale that can represent them. Combining
          # them only proves that fixtures needing non-ASCII I/O cannot run
          # where the filesystem encoding forbids it, which is not a defect.
          - label: C locale
            locale: "C"
            utf8: "0"
            tmpname: "adc-plain-temp"
          - label: international paths
            locale: "C.UTF-8"
            utf8: "1"
            # A space and non-ASCII characters, deliberate test data rather than
            # punctuation drift. A backslash-u escape would create a directory
            # literally named "é" and would test nothing. This file is not
            # part of the distributed skill, where the ASCII-only rule applies.
            tmpname: "adc hostile é中"

    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the test runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest pytest-xdist

      - name: Run the suite where the platform is unhelpful
        shell: bash
        env:
          LC_ALL: ${{ matrix.locale }}
          LANG: ${{ matrix.locale }}
          PYTHONUTF8: ${{ matrix.utf8 }}
          PYTHONCOERCECLOCALE: "0"
        run: |
          set -euo pipefail
          hostile="${RUNNER_TEMP}/${{ matrix.tmpname }}"
          mkdir -p "${hostile}"
          export TMPDIR="${hostile}"
          # Line-ending rewriting on checkout, the setting that made a fixture
          # digest disagree with the archive it came from.
          git config core.autocrlf true
          python -c "import locale, sys, tempfile; print('locale', locale.getpreferredencoding(False)); print('fsenc', sys.getfilesystemencoding()); print('tmp', tempfile.gettempdir())"
          python -m pytest anti-dark-code/tests -q -n auto

  mutation-replay:
    # Linux is the required replay host, and this is the first time the
    # mutation matrix runs anywhere but a developer's machine.
    #
    # The matrix is the repository's coverage record, and until now it was a
    # local artifact: a reviewer had to take its verdicts on trust, and a row
    # could go stale without anything noticing. It caught a test this branch
    # deleted by accident, which is exactly the signal that should not depend
    # on someone remembering to run it.
    #
    # Linux rather than the three-platform matrix above, because verdicts are
    # platform-qualified by design. A host that cannot create a symlink skips
    # the tests that hold the symlink guarantees, and a replay there reports
    # what the host could not observe rather than what the code does. Linux
    # can observe all of it: the suite runs with no skips. Windows and macOS
    # keep their suite legs above and are deliberately not replay hosts.
    name: Mutation replay (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the test runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest

      - name: Replay every mutant
        shell: bash
        run: |
          set -euo pipefail
          # No --write. The committed matrix is the record under review, and a
          # job that rewrites it would be grading its own homework.
          python design/routing/mutants/replay.py --jobs 2

      - name: Refuse a run that did not put the source back
        shell: bash
        run: |
          set -euo pipefail
          # Replay edits real source files and restores them. A dirty tree here
          # means a restore was missed, which would make the verdicts above
          # describe a tree nobody reviewed.
          if [ -n "$(git status --porcelain)" ]; then
            echo "replay left the working tree modified:"
            git status --porcelain
            exit 1
          fi

  # The single context branch protection should require.
  #
  # Protection pins required checks by exact name, so listing every matrix leg
  # there makes the settings page a second implementation of this file's matrix:
  # rename a job or change the matrix and the old names stop reporting, leaving
  # pull requests waiting forever on checks that no longer exist. That is the
  # standing drift risk SKILL.md names under "prefer one canonical rule
  # implementation".
  #
  # This job is the one stable name. The matrix above stays the only authority on
  # what actually runs, and it can change freely without touching protection.
  #
  # The duplication does not disappear, it moves: `needs` still has to name every
  # job that must pass. That is the point. It now lives beside the jobs it
  # governs, changes in the same commit, and shows up in review, instead of
  # sitting in a settings page no diff ever touches.
  shadow:
    # SLICE-002. Records what the proposed routing rules would have skipped on
    # this change and whether anything they skipped failed. It is deliberately
    # not in `required`'s needs and changes no other job: D-011 keeps selective
    # execution behind evidence, and this job is how the evidence is gathered,
    # not a gate. It runs on pull requests only, because a push to main after a
    # merge is the same change measured twice (SLICE-002 section 2).
    name: Shadow evidence record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [suite, distribution, hostile-environment, mutation-replay]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      # The workflow's `contents: read` sets every other scope to none, and the
      # jobs endpoint this job reads needs its own scope.
      actions: read

    steps:
      - name: Check out the tree CI verified
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The base must be reachable or the router reports
          # ADC-ROUTE-BASE-UNREACHABLE and the record measures nothing. A
          # shallow checkout is what made every record unmeasurable in the
          # design challenge's measurement.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Read what CI concluded for this attempt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -B anti-dark-code/scripts/adc.py shadow outcomes \
            --map .github/shadow-gate-map.json \
            --run "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" \
            --out "${RUNNER_TEMP}/outcomes.json"

      - name: Record what the proposed rules would have skipped
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Written outside the tree, so the record is not a change of its own.
          python -B anti-dark-code/scripts/adc.py shadow record \
            --repo . \
            --base "${BASE_SHA}" --base-sha "${BASE_SHA}" \
            --merge "${GITHUB_SHA}" --head "${HEAD_SHA}" \
            --head-ref "${HEAD_REF}" --pr "${PR_NUMBER}" \
            --run "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" \
            --outcomes "${RUNNER_TEMP}/outcomes.json" \
            --out "${RUNNER_TEMP}/shadow-${HEAD_SHA}-${GITHUB_RUN_ATTEMPT}.json"
          git status --porcelain

      - name: Upload the record
        # actions/upload-artifact v4, resolved to its commit through the API.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shadow-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          # The record plus the two sidecars the record step wrote beside it,
          # which name the policy and gates by digest so ingest can recompute
          # the class rather than believe it. Not `*.json`: the outcomes file
          # lives in the same directory, and ingest would read it as a record.
          path: |
            ${{ runner.temp }}/shadow-*.json
            ${{ runner.temp }}/policy-*.json
            ${{ runner.temp }}/gates-*.json
          if-no-files-found: error
          retention-days: 90

  required:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The shadow job is absent here on purpose. Adding it would make a
    # measurement a gate, which is the shape D-011 refuses until the evidence
    # exists. S-058 holds this list.
    needs: [suite, distribution, hostile-environment, mutation-replay]
    # always(), so this reports a verdict even when a dependency fails or is
    # skipped. That makes explicitly checking each result mandatory: without the
    # loop below this job would succeed no matter what happened upstream, which
    # is precisely the check-that-cannot-fail class in 07-adversarial-review.md.
    if: always()

    steps:
      - name: Refuse unless every required job succeeded
        shell: bash
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          HOSTILE_RESULT: ${{ needs.hostile-environment.result }}
          MUTATION_RESULT: ${{ needs.mutation-replay.result }}
        run: |
          set -euo pipefail
          echo "suite=${SUITE_RESULT} distribution=${DISTRIBUTION_RESULT} hostile=${HOSTILE_RESULT} mutation=${MUTATION_RESULT}"
          failed=0
          for entry in "suite=${SUITE_RESULT}" "distribution=${DISTRIBUTION_RESULT}" "hostile=${HOSTILE_RESULT}" "mutation=${MUTATION_RESULT}"; do
            if [ "${entry#*=}" != "success" ]; then
              echo "required job did not succeed: ${entry}"
              failed=1
            fi
          done
          # A matrix job's result is the aggregate of its legs, so one red
          # platform lands here as failure even though the others passed.
          exit "$failed"
