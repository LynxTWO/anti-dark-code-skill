name: Tests

# pull_request, deliberately not pull_request_target. A fork's pull request runs
# here without repository secrets and without write access, so running the suite
# is not the privileged surface the intake workflows are. Do not convert this to
# pull_request_target: it executes candidate code by design.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # One red platform should not hide the others, which is the whole point of
      # running more than one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          # Forward drift, cheaply. The floor is what the three platforms above
          # prove; this catches a newer interpreter changing behaviour under us.
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest

      - name: Validate the core before anything writes to the tree
        shell: bash
        run: |
          set -euo pipefail
          # Ordering matters and is the repository's own rule: a record written
          # after an audit attempt is unaudited. Running the suite first leaves
          # __pycache__ in the skill tree, which this validator reports. Run it
          # against the pristine checkout, and use -B so it writes none itself.
          python -B anti-dark-code/scripts/adc.py validate --skill anti-dark-code --mode universal

      - name: Run the deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          # No pipe into a summarizer here. A pipeline reports its last stage, so
          # piping pytest into tail would report tail's status and a red suite
          # would read as green. See the shell exit-code contract in
          # references/14-deterministic-verification.md.
          python -m pytest anti-dark-code/tests -q

  distribution:
    name: Clean distribution archive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate what a release would actually ship
        shell: bash
        run: |
          set -euo pipefail
          # A working tree can pass while the distributable archive does not: the
          # runtime-only incoming/ inbox shipped inside a release once and only a
          # clean archive showed it. Extract the commit, not the checkout.
          extract="$(mktemp -d)"
          git archive HEAD | tar -x -C "$extract"
          python -B "$extract/anti-dark-code/scripts/adc.py" \
            validate --skill "$extract/anti-dark-code" --mode distribution
