# Shadow evidence job. Copy into the workflow that runs your gates.
#
# It records what the proposed routing rules would have skipped on this
# change and whether anything they skipped failed. It is evidence, never a
# gate: do not add it to your required check, and do not make any job depend
# on it. It runs on pull requests only, because a push after a merge is the
# same change measured twice.
#
# Replace the three placeholders:
#   YOUR_GATE_JOBS  every job that carries a canonical gate, per your map
#   PYTHON_VERSION  a Python 3.12 or newer
#   the action pins are commit SHAs current when this template shipped;
#   re-pin them to the versions your repository trusts.

  shadow:
    name: Shadow evidence record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [YOUR_GATE_JOBS]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      # The jobs endpoint this job reads needs its own scope; a workflow-level
      # `contents: read` sets every other scope to none.
      actions: read

    steps:
      - name: Check out the tree CI verified
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The base must be reachable or the router cannot compute the
          # change set and the record measures nothing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "PYTHON_VERSION"

      - name: Read what CI concluded for this attempt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -B .agents/skills/anti-dark-code/scripts/adc.py shadow outcomes \
            --map .github/shadow-gate-map.json \
            --run "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" \
            --out "${RUNNER_TEMP}/outcomes.json"

      - name: Record what the proposed rules would have skipped
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Written outside the tree, so the record is not a change of its own.
          python -B .agents/skills/anti-dark-code/scripts/adc.py shadow record \
            --repo . \
            --base "${BASE_SHA}" --base-sha "${BASE_SHA}" \
            --merge "${GITHUB_SHA}" --head "${HEAD_SHA}" \
            --head-ref "${HEAD_REF}" --pr "${PR_NUMBER}" \
            --run "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" \
            --outcomes "${RUNNER_TEMP}/outcomes.json" \
            --out "${RUNNER_TEMP}/shadow-${HEAD_SHA}-${GITHUB_RUN_ATTEMPT}.json"
          git status --porcelain

      - name: Upload the record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shadow-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          # The record plus the two sidecars the record step wrote beside it,
          # which name the policy and gates by digest so ingest can recompute
          # the class rather than believe it. Not `*.json`: the outcomes file
          # lives in the same directory, and ingest would read it as a record.
          path: |
            ${{ runner.temp }}/shadow-*.json
            ${{ runner.temp }}/policy-*.json
            ${{ runner.temp }}/gates-*.json
          if-no-files-found: error
          retention-days: 90
